<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Wine Radial -->
    <radialGradient id="wineBg" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#8a1835"/>
      <stop offset="55%" stop-color="#550c20"/>
      <stop offset="100%" stop-color="#2a030d"/>
    </radialGradient>

    <!-- Outer Gold Ring Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffecb8"/>
      <stop offset="35%" stop-color="#d4aa58"/>
      <stop offset="70%" stop-color="#8e6224"/>
      <stop offset="100%" stop-color="#dfb667"/>
    </linearGradient>

    <!-- Inner Monogram Gold Gradient -->
    <linearGradient id="goldLetter" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fae3b3"/>
      <stop offset="60%" stop-color="#dfb667"/>
      <stop offset="100%" stop-color="#ad8245"/>
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#120207" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Circular Archival Wax Medallion -->
  <circle cx="32" cy="32" r="30" fill="url(#wineBg)"/>
  <circle cx="32" cy="32" r="29" stroke="url(#goldRim)" stroke-width="1.8"/>
  <circle cx="32" cy="32" r="26.5" stroke="#dfb667" stroke-width="0.75" stroke-dasharray="1.5 1.5" opacity="0.65"/>

  <!-- Top Star Spark -->
  <path d="M32 10.5 L33 13.5 L36 14.5 L33 15.5 L32 18.5 L31 15.5 L28 14.5 L31 13.5 Z" fill="#ffdf99" opacity="0.9"/>

  <!-- Editorial Monogram "T" with Serif Proportions -->
  <g filter="url(#subtleGlow)">
    <!-- Top Horizontal Crossbar with fine brackets -->
    <path d="M19 22.5 C19 21.8 19.8 21 21.5 21 L42.5 21 C44.2 21 45 21.8 45 22.5 C45 23.2 44.2 24 43 24 C41.8 24 41 24.5 40.5 26 L35.5 26 L35.5 45 C35.5 47 36.8 48 39 48.2 L40 48.3 L40 49.5 L24 49.5 L24 48.3 L25 48.2 C27.2 48 28.5 47 28.5 45 L28.5 26 L23.5 26 C23 24.5 22.2 24 21 24 C19.8 24 19 23.2 19 22.5 Z" fill="url(#goldLetter)"/>
  </g>

  <!-- Bottom Accent: '26 -->
  <text x="32" y="58" font-family="'Cormorant Garamond', Georgia, serif" font-size="8" font-weight="700" letter-spacing="1.5" fill="#f0ca85" text-anchor="middle" opacity="0.95">’26</text>
</svg>
